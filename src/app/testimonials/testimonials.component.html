<section id="testimonials-section" class="relative overflow-hidden" style="background: white; padding: 96px 0;">
  <div class="container mx-auto px-6">
    <!-- Header -->
    <div class="text-center mb-14" style="max-width: 720px; margin-left: auto; margin-right: auto;">
      <span class="eco-eyebrow mb-5 block">{{ 'testimonials.eyebrow' | translate }}</span>
      <h2 class="eco-h2 mb-4">{{ 'testimonials.title' | translate }}</h2>
      <p class="eco-lead mx-auto">{{ 'testimonials.subtitle' | translate }}</p>
    </div>

    <!-- Cards grid -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
      <div *ngFor="let q of quotes; let i = index"
        style="background: white; border: 1px solid var(--gray-200); border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 18px; box-shadow: var(--shadow-sm); transition: all 250ms var(--ease-out);"
        (mouseenter)="$any($event.currentTarget).style.boxShadow='0 20px 40px -12px rgba(0,0,0,0.12)'; $any($event.currentTarget).style.transform='translateY(-2px)'"
        (mouseleave)="$any($event.currentTarget).style.boxShadow='var(--shadow-sm)'; $any($event.currentTarget).style.transform='translateY(0)'">

        <!-- Stars -->
        <div style="display: flex; align-items: center; gap: 4px; color: var(--tier-gold);">
          <i *ngFor="let s of q.stars" class="fa-solid fa-star" style="font-size: 13px;"></i>
        </div>

        <!-- Quote icon -->
        <i class="fa-solid fa-quote-left" style="color: var(--green-200); font-size: 22px;"></i>

        <!-- Quote text -->
        <p style="font-family: var(--font-sans); font-size: 16px; line-height: 1.55; color: var(--gray-700); flex: 1;">
          {{ q.quote | translate }}
        </p>

        <!-- Author -->
        <div style="display: flex; align-items: center; gap: 12px; padding-top: 18px; border-top: 1px solid var(--gray-100);">
          <div style="width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 800; font-size: 15px; color: var(--green-900); flex-shrink: 0;" [style.background]="q.color">
            {{ q.initials }}
          </div>
          <div>
            <div style="font-family: var(--font-sans); font-weight: 700; font-size: 14px; color: var(--gray-900);">{{ q.name }}</div>
            <div style="font-family: var(--font-sans); font-size: 12px; color: var(--gray-500);">{{ q.role | translate }} · {{ q.city }}</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
