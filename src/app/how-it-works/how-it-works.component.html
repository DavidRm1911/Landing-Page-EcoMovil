<section id="how-section" class="relative overflow-hidden" style="background: white; padding: 96px 0;">
  <div class="container mx-auto px-6">
    <!-- Header -->
    <div class="text-center mb-16" style="max-width: 720px; margin-left: auto; margin-right: auto;">
      <span class="eco-eyebrow mb-5 block">{{ 'how-it-works.eyebrow' | translate }}</span>
      <h2 class="eco-h2 mb-4">{{ 'how-it-works.title' | translate }}</h2>
      <p class="eco-lead mx-auto">{{ 'how-it-works.subtitle' | translate }}</p>
    </div>

    <!-- Steps grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-8 relative">
      <!-- Connector line (desktop only) -->
      <div class="absolute hidden md:block" style="top: 35px; left: 12%; right: 12%; height: 2px; background: var(--green-100); z-index: 0;"></div>

      <div *ngFor="let item of steps; let i = index" class="relative z-10 flex flex-col items-start anim-fadeup" [class]="'anim-delay-' + (i+1)">
        <div class="mb-6 flex items-center justify-center rounded-2xl"
             style="width: 72px; height: 72px; background: white; border: 2px solid var(--green-200); box-shadow: 0 6px 16px -8px rgba(22,163,74,0.3); font-size: 26px; color: var(--green-700);">
          <i [class]="'fa-solid ' + item.faIcon"></i>
        </div>
        <div style="font-family: var(--font-display); font-size: 13px; font-weight: 800; color: var(--green-600); letter-spacing: 0.12em; margin-bottom: 8px;">{{ item.number }}</div>
        <h3 class="eco-h3 mb-3">{{ item.title }}</h3>
        <p style="font-family: var(--font-sans); font-size: 15px; line-height: 1.6; color: var(--gray-600);">{{ item.description }}</p>
      </div>
    </div>
  </div>
</section>
