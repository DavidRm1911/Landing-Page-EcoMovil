<section id="plans-section" class="relative overflow-hidden" style="background: linear-gradient(180deg, white 0%, var(--green-50) 100%); padding: 96px 0;">
  <div class="container mx-auto px-6 relative z-10">
    <div class="text-center mb-14" style="max-width: 720px; margin-left: auto; margin-right: auto;">
      <span class="eco-eyebrow mb-5 block">{{ 'plans.eyebrow' | translate }}</span>
      <h2 class="eco-h2 mb-4">{{ 'plans.choose' | translate }}</h2>
      <p class="eco-lead mx-auto">{{ 'plans.subtitle' | translate }}</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-5 items-stretch" style="max-width: 1080px; margin: 0 auto;">
      <div *ngFor="let plan of plans" class="relative overflow-hidden flex flex-col"
           [style.border]="plan.featured ? '2px solid var(--green-600)' : '2px solid var(--gray-200)'"
           [style.transform]="plan.featured ? 'translateY(-12px)' : 'none'"
           [style.boxShadow]="plan.featured ? '0 24px 48px -16px rgba(22,163,74,0.25)' : 'var(--shadow-sm)'"
           style="background: white; border-radius: 24px; padding: 36px 32px; gap: 24px;">

        <!-- Top color stripe -->
        <div class="absolute top-0 left-0 right-0" style="height: 6px;" [style.background]="plan.color"></div>

        <!-- Popular badge -->
        <div *ngIf="plan.featured" class="absolute"
             style="top: 18px; right: 18px; background: var(--green-600); color: white; padding: 4px 12px; border-radius: 999px; font-family: var(--font-sans); font-size: 11px; font-weight: 800; letter-spacing: 0.08em;">
          POPULAR
        </div>

        <!-- Tier + price -->
        <div>
          <div style="font-family: var(--font-sans); font-size: 13px; font-weight: 700; color: var(--gray-500); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 12px;">{{ plan.title }}</div>
          <div class="flex items-baseline gap-2 mb-2">
            <span style="font-family: var(--font-display); font-weight: 900; font-size: 48px; color: var(--green-800); line-height: 1; letter-spacing: -0.025em;">{{ plan.price }}</span>
            <span style="font-family: var(--font-sans); font-size: 14px; color: var(--gray-500);">{{ plan.after }}</span>
          </div>
          <p style="font-family: var(--font-sans); font-size: 14px; color: var(--gray-600); line-height: 1.5;">{{ plan.desc }}</p>
        </div>

        <div style="height: 1px; background: var(--gray-100);"></div>

        <!-- Features -->
        <ul class="flex-1" style="list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px;">
          <li *ngFor="let f of plan.features" style="display: flex; gap: 10px; align-items: flex-start; font-family: var(--font-sans); font-size: 15px; color: var(--gray-700);">
            <span style="width: 22px; height: 22px; border-radius: 999px; background: var(--green-100); color: var(--green-700); display: flex; align-items: center; justify-content: center; font-size: 10px; flex-shrink: 0; margin-top: 2px;">
              <i class="fa-solid fa-check"></i>
            </span>
            {{ f }}
          </li>
        </ul>

        <!-- CTA -->
        <button (click)="onPlanSelect(plan)" class="w-full"
                [style.background]="plan.featured ? 'var(--green-600)' : 'white'"
                [style.color]="plan.featured ? 'white' : 'var(--green-700)'"
                [style.border]="plan.featured ? '1.5px solid var(--green-600)' : '1.5px solid var(--gray-300)'"
                style="padding: 14px 24px; border-radius: 12px; font-family: var(--font-sans); font-weight: 600; font-size: 15px; cursor: pointer; transition: all 200ms;">
          {{ plan.cta }}
        </button>
      </div>
    </div>
  </div>
</section>
