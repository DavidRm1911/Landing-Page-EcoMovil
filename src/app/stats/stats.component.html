<section style="background: white; padding: 32px 0; border-top: 1px solid var(--gray-100); border-bottom: 1px solid var(--gray-100);">
  <div class="container mx-auto px-6">
    <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
      <div *ngFor="let s of stats; let i = index" class="text-center" [style.borderLeft]="i > 0 ? '1px solid var(--gray-200)' : 'none'">
        <div style="font-family: var(--font-display); font-size: clamp(28px, 3vw, 40px); font-weight: 800; color: var(--green-700); line-height: 1; letter-spacing: -0.02em;">{{ s.value }}</div>
        <div style="font-family: var(--font-sans); font-size: 12px; font-weight: 500; color: var(--gray-500); margin-top: 8px; text-transform: uppercase; letter-spacing: 0.08em;">{{ s.label | translate }}</div>
      </div>
    </div>
  </div>
</section>
