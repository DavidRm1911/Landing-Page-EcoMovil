<section id="faq-section" class="relative overflow-hidden" style="background: var(--green-50); padding: 96px 0;">
  <div class="container mx-auto px-6" style="max-width: 880px;">
    <!-- Header -->
    <div class="text-center mb-12">
      <span class="eco-eyebrow mb-5 block">{{ 'faq.eyebrow' | translate }}</span>
      <h2 class="eco-h2 mb-4">{{ 'faq.title' | translate }}</h2>
    </div>

    <!-- Accordion -->
    <div style="display: flex; flex-direction: column; gap: 12px;">
      <div *ngFor="let f of faqs; let i = index"
        style="background: white; border-radius: 16px; overflow: hidden; transition: border-color 200ms var(--ease-out);"
        [style.border]="openIndex === i ? '1.5px solid var(--green-300)' : '1.5px solid var(--gray-200)'">

        <!-- Question button -->
        <button (click)="toggle(i)"
          style="width: 100%; text-align: left; padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; font-family: var(--font-display); font-weight: 700; font-size: 17px; background: none; border: none; cursor: pointer;"
          [style.color]="openIndex === i ? 'var(--green-800)' : 'var(--gray-900)'">
          <span>{{ f.q | translate }}</span>
          <span style="width: 32px; height: 32px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; transition: all 200ms var(--ease-out);"
            [style.background]="openIndex === i ? 'var(--green-600)' : 'var(--green-100)'"
            [style.color]="openIndex === i ? 'white' : 'var(--green-700)'"
            [style.transform]="openIndex === i ? 'rotate(45deg)' : 'rotate(0)'">
            <i class="fa-solid fa-plus"></i>
          </span>
        </button>

        <!-- Answer -->
        <div *ngIf="openIndex === i" style="padding: 0 24px 24px; font-family: var(--font-sans); font-size: 15px; line-height: 1.65; color: var(--gray-600);">
          {{ f.a | translate }}
        </div>
      </div>
    </div>
  </div>
</section>
